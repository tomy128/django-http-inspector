name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Validate tag and project version
        run: python scripts/check_release.py tag
      - name: Install build and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python tests/runtests.py
      - name: Build distributions
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Validate distribution files
        run: python scripts/check_release.py dist
      - name: Test wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/django-http-inspector-wheel-check"
          "$RUNNER_TEMP/django-http-inspector-wheel-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/django-http-inspector-wheel-check/bin/python" -c 'from importlib.resources import files; import django_http_inspector as package; assert package.__version__ == "${{ github.ref_name }}"[1:]; root = files("django_http_inspector"); assert root.joinpath("templates/django_http_inspector/index.html").is_file(); assert root.joinpath("static/django_http_inspector/inspect.js").is_file()'
      - name: Create distribution checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Upload immutable release artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-package-distributions
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-http-inspector
    permissions:
      id-token: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: release-artifact
      - name: Verify release artifact
        working-directory: release-artifact
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          test -f SHA256SUMS
          test ! -L SHA256SUMS
          test -d dist
          test ! -L dist
          root_entries="$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          test "$root_entries" = "$(printf '%s\n' SHA256SUMS dist | LC_ALL=C sort)"
          version="${RELEASE_VERSION#v}"
          dist_entries="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          expected="$(printf '%s\n' "django_http_inspector-${version}.tar.gz" "django_http_inspector-${version}-py3-none-any.whl" | LC_ALL=C sort)"
          test "$dist_entries" = "$expected"
          test -z "$(find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-artifact/dist/

  publish-github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: release-artifact
      - name: Verify release artifact
        working-directory: release-artifact
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          test -f SHA256SUMS
          test ! -L SHA256SUMS
          test -d dist
          test ! -L dist
          root_entries="$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          test "$root_entries" = "$(printf '%s\n' SHA256SUMS dist | LC_ALL=C sort)"
          version="${RELEASE_VERSION#v}"
          dist_entries="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          expected="$(printf '%s\n' "django_http_inspector-${version}.tar.gz" "django_http_inspector-${version}-py3-none-any.whl" | LC_ALL=C sort)"
          test "$dist_entries" = "$expected"
          test -z "$(find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
      - name: Create release with verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-artifact/dist/* \
            release-artifact/SHA256SUMS \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
